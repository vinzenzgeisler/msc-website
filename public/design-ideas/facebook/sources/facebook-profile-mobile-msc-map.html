<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook-Profilbild – MSC und Strecke | MSC Oberlausitzer Dreiländereck e. V.</title>
    <style>
      :root {
        --primary-dark: hsl(220 70% 30%);
        --accent: hsl(48 100% 50%);
        --profile-size: 1200px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        min-width: var(--profile-size);
        min-height: var(--profile-size);
        background: transparent;
      }

      .profile {
        position: relative;
        width: var(--profile-size);
        height: var(--profile-size);
        overflow: hidden;
        background: var(--primary-dark);
      }

      .track {
        position: absolute;
        top: 115px;
        left: 100px;
        width: 1000px;
        height: 950px;
        object-fit: contain;
        opacity: 0.2;
        filter:
          invert(1)
          drop-shadow(0 22px 24px hsl(220 70% 12% / 0.28));
        transform: rotate(-8deg);
      }

      .monogram {
        position: absolute;
        z-index: 1;
        top: 485px;
        left: 285px;
        width: 630px;
        height: auto;
        object-fit: contain;
        filter:
          grayscale(1)
          brightness(0)
          invert(1)
          drop-shadow(0 24px 24px hsl(220 70% 12% / 0.44))
          drop-shadow(0 6px 6px hsl(220 70% 10% / 0.25));
      }
    </style>
  </head>
  <body>
    <main class="profile" aria-label="Vereinfachtes Facebook-Profilbild des MSC Oberlausitzer Dreiländereck e. V.">
      <img class="track" src="../assets/msc-map.svg" alt="" aria-hidden="true" />
      <img class="monogram" src="../assets/MSC-monogram.png" alt="MSC" />
    </main>
  </body>
</html>
